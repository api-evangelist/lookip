                $ref: '#/components/schemas/Error'
              examples:
                rate_limited:
                  summary: Per-key cap of 50 requests/second exceeded, or the upstream provider rate-limited a MAX lookup. No credit spent.
                  value:
                    error:
                      code: rate_limited
                      message: Per-key cap of 50 requests/second exceeded, or the upstream provider rate-limited a MAX lookup. No credit spent.
        '500':
          description: '`internal_error` — Unhandled server fault. Any charge already taken is reversed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal_error:
                  summary: Unhandled server fault. Any charge already taken is reversed.
                  value:
                    error:
                      code: internal_error
                      message: Unhandled server fault. Any charge already taken is reversed.
        '503':
          description: '`service_busy` — The database was briefly unable to start a transaction. Nothing was charged. Retry after a second.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                service_busy:
                  summary: The database was briefly unable to start a transaction. Nothing was charged. Retry after a second.
                  value:
                    error:
                      code: service_busy
                      message: The database was briefly unable to start a transaction. Nothing was charged. Retry after a second.
components:
  schemas:
    Network:
      type: object
      title: Network
      properties:
        asn:
          type: string
          description: Autonomous system number, prefixed with AS.
          examples:
          - AS15169
        organization:
          type: string
          description: Registered organisation name for the network.
        domain:
          type: string
          description: Domain of the registered organisation.
        type:
          type: string
          description: Network category, for example business, isp, hosting, education, government.
        asnUpdatedAt:
          type: string
          description: ISO date the ASN allocation last changed.
          format: date
    ErrorCode:
      type: string
      title: ErrorCode
      description: Every `error.code` this API can return.
      enum:
      - invalid_request
      - invalid_ip
      - unauthorized
      - insufficient_credit
      - insufficient_credit_for_max
      - not_found
      - rate_limited
      - internal_error
      - auth_failed
      - upstream_error
      - lite_db_unavailable
      - service_busy
    BatchMaxResponse:
      type: object
      title: BatchMaxResponse
      description: Keyed by the address as it was sent.
      additionalProperties:
        oneOf:
        - $ref: '#/components/schemas/IpRecord'
        - $ref: '#/components/schemas/BatchEntryError'
    Location:
      type: object
      title: Location
      properties:
        city:
          type: string
          description: City name.
        region:
          type: string
          description: Region or state name.
        regionCode:
          type: string
          description: Region or state code.
        country:
          type: string
          description: Country name.
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2 country code.
        continent:
          type: string
          description: Continent name.
        continentCode:
          type: string
          description: Two-letter continent code.
        latitude:
          type: number
          description: Latitude of the geolocation estimate.
        longitude:
          type: number
          description: Longitude of the geolocation estimate.
        timezone:
          type: string
          description: IANA timezone name.
        postalCode:
          type: string
          description: Postal or ZIP code.
        dmaCode:
          type: string
          description: US designated market area code.
        geonameId:
          type: string
          description: GeoNames identifier for the place.
        accuracyRadiusKm:
          type: number
          description: Radius in km the geolocation estimate is confident within.
        geoUpdatedAt:
          type: string
          description: ISO date the geo allocation last changed.
          format: date
    BatchEntryError:
      type: object
      title: BatchEntryError
      description: 'A per-address failure inside a batch response. Note the flat shape: `error` is a code string here, not the `{ code, message }` object a whole-call error uses.'
      properties:
        error:
          $ref: '#/components/schemas/ErrorCode'
      required:
      - error
    LiteNetwork:
      type: object
      title: LiteNetwork
      description: The three network fields the local dataset can answer.
      properties:
        asn:
          type: string
          description: Autonomous system number, prefixed with AS.
          examples:
          - AS15169
        organization:
          type: string
          description: Registered organisation name for the network.
        domain:
          type: string
          description: Domain of the registered organisation.
    Error:
      type: object
      title: Error
      properties:
        error:
          type: object
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Human-readable detail. Do not branch on it.
          required:
          - code
          - message
      required:
      - error
    BatchLiteResponse:
      type: object
      title: BatchLiteResponse
      description: Keyed by the address as it was sent.
      additionalProperties:
        oneOf:
        - $ref: '#/components/schemas/LiteRecord'
        - $ref: '#/components/schemas/BatchEntryError'
    IpRecord:
      type: object
      title: IpRecord
      description: A MAX record. Every field except `ip` is optional and may be absent when there is no signal; treat missing and null identically. Branch on `bogon === true` before reading `location` or `network`.
      properties:
        ip:
          type: string
          description: The address this record describes.
        hostname:
          type: string
          description: Reverse DNS name, when one resolves.
        bogon:
          type: boolean
          description: The address is reserved or non-routable. No other field populates.
        location:
          $ref: '#/components/schemas/Location'
        network:
          $ref: '#/components/schemas/Network'
        mobile:
          $ref: '#/components/schemas/Mobile'
        threats:
          $ref: '#/components/schemas/Threats'
        flags:
          $ref: '#/components/schemas/Flags'
        lastUpdated:
          type: string
          description: ISO-8601 time this record was last refreshed.
          format: date-time
        derivedFields:
          type: array
          items:
            type: string
          description: Dotted paths of fields we worked out ourselves rather than received. A field that is present and NOT listed here came from upstream. Absent on most responses.
          examples:
          - - threats.isVpn
      required:
      - ip
    Mobile:
      type: object
      title: Mobile
      properties:
        carrier:
          type: string
          description: Mobile carrier name.
        mcc:
          type: string
          description: Mobile country code.
        mnc:
          type: string
          description: Mobile network code.
    InsufficientCreditError:
      type: object
      title: InsufficientCreditError
      description: The 402 body, which uniquely carries a `credit` object so a client can tell the operator exactly how short it is. The `*MicroUsd` fields are exact strings; the `*Cents` fields are a rounded convenience view and must not be used for reconciliation.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
              - insufficient_credit
              - insufficient_credit_for_max
            message:
              type: string
          required:
          - code
          - message
        credit:
          type: object
          properties:
            balanceMicroUsd:
              type: string
              pattern: ^-?[0-9]+$
            needMicroUsd:
              type: string
              pattern: ^[0-9]+$
            balanceCents:
              type: integer
            needCents:
              type: integer
            eligibleMicroUsd:
              type: string
              pattern: ^[0-9]+$
              description: 'Only on `insufficient_credit_for_max`: what the lots eligible for this kind still hold. The gap between this and `balanceMicroUsd` is the LITE-only signup grant.'
            eligibleCents:
              type: integer
            kind:
              type: string
              enum:
              - LITE
              - MAX
          required:
          - balanceMicroUsd
          - needMicroUsd
          - balanceCents
          - needCents
          - kind
      required:
      - error
      - credit
    LiteRecord:
      type: object
      title: LiteRecord
      description: 'A LITE record. Narrower than a MAX record by design: the local dataset answers country and continent, not city, and carries no threat signals.'
      properties:
        ip:
          type: string
          description: The address this record describes.
        bogon:
          type: boolean
          description: The address is reserved or non-routable. No other field populates.
        location:
          $ref: '#/components/schemas/LiteLocation'
        network:
          $ref: '#/components/schemas/LiteNetwork'
        lastUpdated:
          type: string
          description: ISO-8601 time this record was last refreshed.
          format: date-time
        datasetUpdatedAt:
          type: string
          format: date-time
          description: Build time of the local dataset behind this answer, as an ISO-8601 timestamp. The only field that tells you the data has gone stale.
      required:
      - ip
    Flags:
      type: object
      title: Flags
      description: Cheap network booleans. A missing boolean means we hold no data on it. It does NOT mean the answer is false — screen for anonymisers by treating an absent value as unknown, never as a negative.
      properties:
        isAnonymous:
          type: boolean
          description: Any anonymising signal is set. Deduced from the booleans upstream sent.
        isAnycast:
          type: boolean
          description: The address is anycast.
        isHosting:
          type: boolean
          description: The address belongs to a hosting or cloud network.
        isMobile:
          type: boolean
          description: The address belongs to a mobile network.
        isSatellite:
          type: boolean
          description: The address belongs to a satellite network.
        isResidentialProxy:
          type: boolean
          description: The address is a known residential proxy.
    Threats:
      type: object
      title: Threats
      description: Anonymiser signals. A missing boolean means we hold no data on it. It does NOT mean the answer is false — screen for anonymisers by treating an absent value as unknown, never as a negative.
      properties:
        service:
          type: string
          description: Named anonymiser detected on the address, when there is one.
        lastSeen:
          type: string
          description: ISO date the address was last seen anonymising.
          format: date
        recentActivityPct:
          type: number
          description: Share of recent days the address behaved like an anonymiser.
          minimum: 0
          maximum: 100
        isProxy:
          type: boolean
          description: The address is a known proxy.
        isRelay:
          type: boolean
          description: The address is a known private relay.
        isTor:
          type: boolean
          description: The address is a known Tor node.
        isVpn:
          type: boolean
          description: The address is a known VPN endpoint.
        isResidentialProxy:
          type: boolean
          description: The address is a known residential proxy.
    BatchRequest:
      type: object
      title: BatchRequest
      properties:
        ips:
          type: array
          description: Addresses to look up. Duplicates collapse — the response is keyed by address — and are charged once.
          items:
            type: string
          minItems: 1
          maxItems: 100
      required:
      - ips
    LiteLocation:
      type: object
      title: LiteLocation
      description: The four location fields the local dataset can answer.
      properties:
        country:
          type: string
          description: Country name.
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2 country code.
        continent:
          type: string
          description: Continent name.
        continentCode:
          type: string
          description: Two-letter continent code.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Send your key as `Authorization: Bearer <key>`. The `?token=` query parameter is no longer accepted — a credential in a URL lands in access logs, browser history and the Referer header, none of which can be un-sent.'
externalDocs:
  description: API documentation
  url: https://lookip.io/docs
