        '503':
          description: '`service_busy` — The database was briefly unable to start a transaction. Nothing
            was charged. Retry after a second.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                service_busy:
                  summary: The database was briefly unable to start a transaction. Nothing was charged.
                    Retry after a second.
                  value:
                    error:
                      code: service_busy
                      message: The database was briefly unable to start a transaction. Nothing was charged.
                        Retry after a second.
  /v1/asn/{asn}:
    get:
      tags:
      - ASN
      operationId: getAsn
      summary: ASN Record
      description: One ASN from the public directory. No key, no credit.
      security: []
      parameters:
      - name: asn
        in: path
        required: true
        description: AS number, with or without the AS prefix.
        schema:
          type: string
          pattern: ^(?:[Aa][Ss])?[0-9]+$
        example: AS15169
      responses:
        '200':
          description: The ASN record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsnRecord'
              examples:
                record:
                  summary: One ASN from the public directory.
                  value:
                    asn: AS15169
                    number: 15169
                    name: Google LLC
                    domain: google.com
                    country: US
                    prefixCount: 6079
                    datasetVersion: '2026-08-13T13:37:50.000Z'
        '400':
          description: '`invalid_request` — Malformed body, invalid context, bad batch array, or an unparseable
            ASN.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  summary: Malformed body, invalid context, bad batch array, or an unparseable ASN.
                  value:
                    error:
                      code: invalid_request
                      message: Malformed body, invalid context, bad batch array, or an unparseable ASN.
        '404':
          description: '`not_found` — No such ASN on the ASN endpoints. On a MAX lookup it also means
            the upstream provider holds no record for the address; the charge is reversed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found:
                  summary: No such ASN on the ASN endpoints. On a MAX lookup it also means the upstream
                    provider holds no record for the address; the charge is reversed.
                  value:
                    error:
                      code: not_found
                      message: No such ASN on the ASN endpoints. On a MAX lookup it also means the upstream
                        provider holds no record for the address; the charge is reversed.
        '500':
          description: '`internal_error` — Unhandled server fault. Any charge already taken is reversed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal_error:
                  summary: Unhandled server fault. Any charge already taken is reversed.
                  value:
                    error:
                      code: internal_error
                      message: Unhandled server fault. Any charge already taken is reversed.
        '503':
          description: '`service_busy` — The database was briefly unable to start a transaction. Nothing
            was charged. Retry after a second.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                service_busy:
                  summary: The database was briefly unable to start a transaction. Nothing was charged.
                    Retry after a second.
                  value:
                    error:
                      code: service_busy
                      message: The database was briefly unable to start a transaction. Nothing was charged.
                        Retry after a second.
  /v1/asn:
    get:
      tags:
      - ASN
      operationId: searchAsn
      summary: ASN Search
      description: Search the public ASN directory by name, domain or number. No key, no credit.
      security: []
      parameters:
      - name: q
        in: query
        required: false
        description: Matches organisation name, domain, or AS number.
        schema:
          type: string
          maxLength: 120
      - name: country
        in: query
        required: false
        description: ISO 3166-1 alpha-2 country code.
        schema:
          type: string
          maxLength: 2
      - name: limit
        in: query
        required: false
        description: Maximum rows to return, 1 to 100. Anything unparseable falls back to the default.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: Matching ASN records, ordered by `prefixCount` descending — a sampled IPv4 size
            proxy, not a count of announced prefixes; see the field description. A row here is the same
            `AsnRecord` the single-record endpoint returns, `datasetVersion` included, so an ingest never
            has to come back and ask how current a row was.
          content:
            application/json:
              schema:
