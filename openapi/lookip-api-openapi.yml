openapi: 3.1.1
info:
  title: Lookip API
  version: 1.0.0
  summary: IP geolocation, ASN and VPN/proxy/Tor/hosting detection for any IPv4 or IPv6 address — we name
    the anonymising service, not just flag it. Prepaid credit, metered per query, no subscription.
  description: 'IP intelligence over plain HTTP GET and POST. Two lookup kinds, chosen by URL path and
    never by a header or body field:


    - **LITE** — geolocation and ASN from our local dataset. Sub-5ms p95.

    - **MAX** — full enrichment: city geolocation, VPN/proxy/Tor/relay/residential-proxy detection, hosting
    and anycast flags, reverse DNS, mobile carrier.


    ## Billing


    Prepaid credit, metered per query. No plans, no subscriptions, no monthly quotas — one balance funds
    both kinds. Amounts are in µUSD (micro-USD); 1 USD = 1,000,000 µUSD.


    | Kind | Per query | Per 1,000 |

    |------|-----------|-----------|

    | LITE | 150 µUSD | $0.15 |

    | MAX | 1,300 µUSD | $1.30 |


    Every response that debited credit carries `X-Lookup-Kind`, `X-Credit-Debit-MicroUsd` and `X-Credit-Balance-MicroUsd`.
    Both amounts are decimal strings holding integers that can exceed 2^53 — parse them as BigInt or int64,
    never as a float. Bogon and error responses carry none of the three, because nothing was charged.


    ## Limits


    50 requests/second per API key, shared across every authenticated endpoint and both kinds. A batch
    call counts as one request against the rate limit but debits for every resolvable address in it.


    A second ceiling of 100 requests/second applies per calling address across all of `/v1`, including
    the public ASN endpoints. It sits in front of authentication, so it also bounds requests that carry
    no key or a rejected one. It is deliberately above the per-key cap and cannot be what stops a single
    key from reaching 50/second. Both refusals are `rate_limited` with status 429 and neither spends credit.


    The public ASN endpoints need no key and are not metered — the ceiling above is a rate, not a charge.


    ## Errors


    Every error body is `{ "error": { "code", "message" } }`. Retry `rate_limited`, `lite_db_unavailable`,
    `service_busy`, `upstream_error`, `internal_error` and any 5xx with jittered backoff; never retry
    `invalid_request`, `invalid_ip`, `unauthorized`, `insufficient_credit` or `insufficient_credit_for_max`.
    A charge taken for a lookup we then failed to serve is reversed before the response is sent, so a
    retry costs one lookup and not two.


    A longer implementation spec written for code-generating agents is at https://lookip.io/llms.txt.'
  termsOfService: https://lookip.io/legal/terms
  contact:
    name: Lookip
    url: https://lookip.io/docs
    email: hi@lookip.io
externalDocs:
  description: API documentation
  url: https://lookip.io/docs
servers:
- url: https://api.lookip.io
  description: Production
security:
- bearerAuth: []
tags:
- name: Lookup
  description: Single-address lookups.
- name: Batch
  description: Up to 100 addresses per call.
- name: ASN
  description: Public ASN directory. No key, no credit.
- name: Service
  description: Service index, liveness and this document.
paths:
  /:
    get:
      tags:
      - Service
      operationId: getServiceIndex
      summary: Service Index
      description: Service name, version, and the canonical endpoint list.
      security: []
      responses:
        '200':
          description: Service index.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceIndex'
              examples:
                index:
                  summary: The service index.
                  value:
                    service: lookip-api
                    version: '1.0'
                    docs: https://lookip.io/docs
                    openapi: /openapi.json
                    endpoints:
                    - /v1/lookup/lite/:ip
                    - /v1/lookup/max/:ip
                    - /v1/lookup/me
                    - /v1/batch/lite
                    - /v1/batch/max
                    - /v1/asn/:asn
                    - /v1/asn?q=&country=
                    - /openapi.json
  /health:
    get:
      tags:
      - Service
      operationId: getHealth
      summary: Liveness Probe
      description: 'Always 200 with `ok: true` while the process is answering. `ok` is liveness and never
        depends on `lite`: a process whose Lite dataset failed to load is still alive and still serves
        every other endpoint, and reporting that in the status code would stop a container from ever becoming
        healthy. When `lite.loaded` is false every LITE lookup on this process answers 503 `lite_db_unavailable`,
        and `lite.datasetUpdatedAt` is null.'
      security: []
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                up:
                  summary: The service is up and the Lite dataset is in memory.
                  value:
                    ok: true
                    ts: 1786726485972
                    lite:
                      loaded: true
                      datasetUpdatedAt: '2026-08-22T04:11:07.000Z'
  /openapi.json:
    get:
      tags:
      - Service
      operationId: getOpenApiDocument
      summary: OpenAPI Document
      description: This document.
      security: []
      responses:
        '200':
          description: The OpenAPI 3.1 description of this API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApiDocument'
              examples:
                head:
                  summary: The first fields of this document. The real body carries `paths` and `components`.
                  value:
                    openapi: 3.1.1
                    info:
                      title: Lookip API
                      version: 1.0.0
                      summary: IP geolocation, ASN and VPN/proxy/Tor/hosting detection for any IPv4 or
                        IPv6 address — we name the anonymising service, not just flag it. Prepaid credit,
                        metered per query, no subscription.
                    servers:
                    - url: https://api.lookip.io
                      description: Production
  /v1/lookup/lite/{ip}:
    get:
      tags:
      - Lookup
      operationId: lookupLite
      summary: LITE Lookup
      description: 'Geolocation and ASN from our local dataset. Reserved and non-routable addresses answer
        `{ ip, bogon: true }` free of charge and set no credit headers.'
      parameters:
      - name: ip
        in: path
        required: true
        description: IPv4 or IPv6 address.
        schema:
          type: string
        example: 8.8.8.8
      responses:
        '200':
          description: A LITE record, or a bogon record.
          headers:
            X-Lookup-Kind:
              description: Which kind was billed.
              schema:
                type: string
                enum:
                - LITE
                - MAX
            X-Credit-Debit-MicroUsd:
              description: µUSD this call cost, as a decimal string. Net of any reversal.
              schema:
                type: string
                pattern: ^[0-9]+$
            X-Credit-Balance-MicroUsd:
              description: µUSD remaining after the debit, as a decimal string.
              schema:
                type: string
                pattern: ^[0-9]+$
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiteRecord'
              examples:
                record:
                  summary: A LITE record.
                  value:
                    ip: 8.8.8.8
                    location:
                      country: United States
                      countryCode: US
                      continent: North America
                      continentCode: NA
                    network:
                      asn: AS15169
                      organization: Google LLC
                      domain: google.com
                    lastUpdated: '2026-08-14T09:45:16.269Z'
                    datasetUpdatedAt: '2026-08-13T13:37:50.000Z'
                bogon:
                  summary: A reserved or non-routable address. Free, and no credit headers are set.
                  value:
                    ip: 10.0.0.1
                    bogon: true
        '400':
          description: '`invalid_ip` — The supplied address is not a valid IPv4 or IPv6.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_ip:
                  summary: The supplied address is not a valid IPv4 or IPv6.
                  value:
                    error:
                      code: invalid_ip
                      message: The supplied address is not a valid IPv4 or IPv6.
        '401':
          description: '`unauthorized` — Missing, invalid, or revoked API key.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unauthorized:
                  summary: Missing, invalid, or revoked API key.
                  value:
                    error:
                      code: unauthorized
                      message: Missing, invalid, or revoked API key.
        '402':
          description: '`insufficient_credit` — Balance too low to serve the call. Nothing was debited
            and nothing was served.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientCreditError'
              examples:
                insufficient_credit:
                  summary: Balance too low to serve the call. Nothing was debited and nothing was served.
                  value:
                    error:
                      code: insufficient_credit
                      message: Balance too low to serve the call. Nothing was debited and nothing was
                        served.
                    credit:
                      balanceMicroUsd: '420'
                      needMicroUsd: '1300'
                      balanceCents: 0
                      needCents: 0
                      kind: MAX
        '429':
          description: '`rate_limited` — Per-key cap of 50 requests/second exceeded, or the upstream provider
            rate-limited a MAX lookup. No credit spent.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rate_limited:
                  summary: Per-key cap of 50 requests/second exceeded, or the upstream provider rate-limited
                    a MAX lookup. No credit spent.
                  value:
                    error:
                      code: rate_limited
                      message: Per-key cap of 50 requests/second exceeded, or the upstream provider rate-limited
                        a MAX lookup. No credit spent.
        '500':
          description: '`internal_error` — Unhandled server fault. Any charge already taken is reversed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal_error:
                  summary: Unhandled server fault. Any charge already taken is reversed.
                  value:
                    error:
                      code: internal_error
                      message: Unhandled server fault. Any charge already taken is reversed.
        '503':
          description: '`lite_db_unavailable` — LITE dataset still loading (cold start, under 30s). No
            credit spent. `service_busy` — The database was briefly unable to start a transaction. Nothing
            was charged. Retry after a second.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                lite_db_unavailable:
                  summary: LITE dataset still loading (cold start, under 30s). No credit spent.
                  value:
                    error:
                      code: lite_db_unavailable
                      message: LITE dataset still loading (cold start, under 30s). No credit spent.
                service_busy:
                  summary: The database was briefly unable to start a transaction. Nothing was charged.
                    Retry after a second.
                  value:
                    error:
                      code: service_busy
                      message: The database was briefly unable to start a transaction. Nothing was charged.
                        Retry after a second.
