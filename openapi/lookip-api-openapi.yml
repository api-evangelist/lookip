  /v1/lookup/max/{ip}:
    get:
      tags:
      - Lookup
      operationId: lookupMax
      summary: MAX Lookup
      description: 'Full enrichment. Reserved and non-routable addresses answer `{ ip, bogon: true }`
        free of charge and set no credit headers.'
      parameters:
      - name: ip
        in: path
        required: true
        description: IPv4 or IPv6 address.
        schema:
          type: string
        example: 8.8.8.8
      responses:
        '200':
          description: A MAX record, or a bogon record.
          headers:
            X-Lookup-Kind:
              description: Which kind was billed.
              schema:
                type: string
                enum:
                - LITE
                - MAX
            X-Credit-Debit-MicroUsd:
              description: µUSD this call cost, as a decimal string. Net of any reversal.
              schema:
                type: string
                pattern: ^[0-9]+$
            X-Credit-Balance-MicroUsd:
              description: µUSD remaining after the debit, as a decimal string.
              schema:
                type: string
                pattern: ^[0-9]+$
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IpRecord'
              examples:
                record:
                  summary: A MAX record. `threats.service`, `threats.lastSeen` and `threats.recentActivityPct`
                    are shown populated so the shape is visible; they are present only when the address
                    is a detected anonymiser.
                  value:
                    ip: 8.8.8.8
                    hostname: dns.google
                    location:
                      city: Mountain View
                      region: California
                      regionCode: CA
                      country: United States
                      countryCode: US
                      continent: North America
                      continentCode: NA
                      latitude: 37.4056
                      longitude: -122.0775
                      timezone: America/Los_Angeles
                      postalCode: '94043'
                      dmaCode: '807'
                      geonameId: '5375480'
                      accuracyRadiusKm: 50
                      geoUpdatedAt: '2026-01-04'
                    network:
                      asn: AS15169
                      organization: Google LLC
                      domain: google.com
                      type: hosting
                      asnUpdatedAt: '2021-05-01'
                    threats:
                      service: NordVPN
                      lastSeen: '2026-05-10'
                      recentActivityPct: 85
                      isProxy: false
                      isRelay: false
                      isTor: false
                      isVpn: false
                      isResidentialProxy: false
                    flags:
                      isAnonymous: false
                      isAnycast: true
                      isHosting: true
                      isMobile: false
                      isSatellite: false
                      isResidentialProxy: false
                    lastUpdated: '2026-08-14T09:45:16.269Z'
                bogon:
                  summary: A reserved or non-routable address. Free, and no credit headers are set.
                  value:
                    ip: 10.0.0.1
                    bogon: true
        '400':
          description: '`invalid_ip` — The supplied address is not a valid IPv4 or IPv6.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_ip:
                  summary: The supplied address is not a valid IPv4 or IPv6.
                  value:
                    error:
                      code: invalid_ip
                      message: The supplied address is not a valid IPv4 or IPv6.
        '401':
          description: '`unauthorized` — Missing, invalid, or revoked API key.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unauthorized:
                  summary: Missing, invalid, or revoked API key.
                  value:
                    error:
                      code: unauthorized
                      message: Missing, invalid, or revoked API key.
        '402':
          description: '`insufficient_credit` — Balance too low to serve the call. Nothing was debited
            and nothing was served. `insufficient_credit_for_max` — The balance cannot fund a MAX lookup:
            the signup grant is spendable on LITE only. Top up to use MAX. Nothing was debited and nothing
            was served.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientCreditError'
              examples:
                insufficient_credit:
                  summary: Balance too low to serve the call. Nothing was debited and nothing was served.
                  value:
                    error:
                      code: insufficient_credit
                      message: Balance too low to serve the call. Nothing was debited and nothing was
                        served.
                    credit:
                      balanceMicroUsd: '420'
                      needMicroUsd: '1300'
                      balanceCents: 0
                      needCents: 0
                      kind: MAX
                insufficient_credit_for_max:
                  summary: 'The balance cannot fund a MAX lookup: the signup grant is spendable on LITE
                    only. Top up to use MAX. Nothing was debited and nothing was served.'
                  value:
                    error:
                      code: insufficient_credit_for_max
                      message: 'The balance cannot fund a MAX lookup: the signup grant is spendable on
                        LITE only. Top up to use MAX. Nothing was debited and nothing was served.'
                    credit:
                      balanceMicroUsd: '5000000'
                      needMicroUsd: '1300'
                      balanceCents: 500
                      needCents: 0
                      eligibleMicroUsd: '0'
                      eligibleCents: 0
                      kind: MAX
        '404':
          description: '`not_found` — No such ASN on the ASN endpoints. On a MAX lookup it also means
            the upstream provider holds no record for the address; the charge is reversed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found:
                  summary: No such ASN on the ASN endpoints. On a MAX lookup it also means the upstream
                    provider holds no record for the address; the charge is reversed.
                  value:
                    error:
                      code: not_found
                      message: No such ASN on the ASN endpoints. On a MAX lookup it also means the upstream
                        provider holds no record for the address; the charge is reversed.
        '429':
          description: '`rate_limited` — Per-key cap of 50 requests/second exceeded, or the upstream provider
            rate-limited a MAX lookup. No credit spent.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rate_limited:
                  summary: Per-key cap of 50 requests/second exceeded, or the upstream provider rate-limited
                    a MAX lookup. No credit spent.
                  value:
                    error:
                      code: rate_limited
                      message: Per-key cap of 50 requests/second exceeded, or the upstream provider rate-limited
                        a MAX lookup. No credit spent.
        '500':
          description: '`internal_error` — Unhandled server fault. Any charge already taken is reversed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal_error:
                  summary: Unhandled server fault. Any charge already taken is reversed.
                  value:
                    error:
                      code: internal_error
                      message: Unhandled server fault. Any charge already taken is reversed.
        '502':
          description: '`upstream_error` — MAX enrichment failed. The status mirrors the upstream response
            when it sent one, so any 4xx or 5xx is possible here. The charge is reversed automatically.
            `auth_failed` — MAX enrichment could not authenticate to our upstream data provider. This
            is our credential, not yours — your key is fine and must not be discarded. Nothing is charged.
            Back off and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                upstream_error:
                  summary: MAX enrichment failed. The status mirrors the upstream response when it sent
                    one, so any 4xx or 5xx is possible here. The charge is reversed automatically.
                  value:
                    error:
                      code: upstream_error
                      message: MAX enrichment failed. The status mirrors the upstream response when it
                        sent one, so any 4xx or 5xx is possible here. The charge is reversed automatically.
                auth_failed:
                  summary: MAX enrichment could not authenticate to our upstream data provider. This is
                    our credential, not yours — your key is fine and must not be discarded. Nothing is
                    charged. Back off and retry.
                  value:
                    error:
                      code: auth_failed
                      message: MAX enrichment could not authenticate to our upstream data provider. This
                        is our credential, not yours — your key is fine and must not be discarded. Nothing
                        is charged. Back off and retry.
        '503':
          description: '`service_busy` — The database was briefly unable to start a transaction. Nothing
            was charged. Retry after a second.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                service_busy:
                  summary: The database was briefly unable to start a transaction. Nothing was charged.
                    Retry after a second.
                  value:
                    error:
                      code: service_busy
                      message: The database was briefly unable to start a transaction. Nothing was charged.
                        Retry after a second.
        default:
          description: '`upstream_error` — MAX enrichment failed. The status mirrors the upstream response
            when it sent one, so any 4xx or 5xx is possible here. The charge is reversed automatically.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                upstream_error:
                  summary: MAX enrichment failed. The status mirrors the upstream response when it sent
                    one, so any 4xx or 5xx is possible here. The charge is reversed automatically.
                  value:
                    error:
                      code: upstream_error
                      message: MAX enrichment failed. The status mirrors the upstream response when it
                        sent one, so any 4xx or 5xx is possible here. The charge is reversed automatically.
