components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Send your key as `Authorization: Bearer <key>`. The `?token=` query parameter is no
        longer accepted — a credential in a URL lands in access logs, browser history and the Referer
        header, none of which can be un-sent.'
  schemas:
    ErrorCode:
      type: string
      title: ErrorCode
      description: Every `error.code` this API can return.
      enum:
      - invalid_request
      - invalid_ip
      - unauthorized
      - insufficient_credit
      - insufficient_credit_for_max
      - not_found
      - rate_limited
      - internal_error
      - auth_failed
      - upstream_error
      - lite_db_unavailable
      - service_busy
    Error:
      type: object
      title: Error
      properties:
        error:
          type: object
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Human-readable detail. Do not branch on it.
          required:
          - code
          - message
      required:
      - error
    InsufficientCreditError:
      type: object
      title: InsufficientCreditError
      description: The 402 body, which uniquely carries a `credit` object so a client can tell the operator
        exactly how short it is. The `*MicroUsd` fields are exact strings; the `*Cents` fields are a rounded
        convenience view and must not be used for reconciliation.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
              - insufficient_credit
              - insufficient_credit_for_max
            message:
              type: string
          required:
          - code
          - message
        credit:
          type: object
          properties:
            balanceMicroUsd:
              type: string
              pattern: ^-?[0-9]+$
            needMicroUsd:
              type: string
              pattern: ^[0-9]+$
            balanceCents:
              type: integer
            needCents:
              type: integer
            eligibleMicroUsd:
              type: string
              pattern: ^[0-9]+$
              description: 'Only on `insufficient_credit_for_max`: what the lots eligible for this kind
                still hold. The gap between this and `balanceMicroUsd` is the LITE-only signup grant.'
            eligibleCents:
              type: integer
            kind:
              type: string
              enum:
              - LITE
              - MAX
          required:
          - balanceMicroUsd
          - needMicroUsd
          - balanceCents
          - needCents
          - kind
      required:
      - error
      - credit
    Location:
      type: object
      title: Location
      properties:
        city:
          type: string
          description: City name.
        region:
          type: string
          description: Region or state name.
        regionCode:
          type: string
          description: Region or state code.
        country:
          type: string
          description: Country name.
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2 country code.
        continent:
          type: string
          description: Continent name.
        continentCode:
          type: string
          description: Two-letter continent code.
        latitude:
          type: number
          description: Latitude of the geolocation estimate.
        longitude:
          type: number
          description: Longitude of the geolocation estimate.
        timezone:
          type: string
          description: IANA timezone name.
        postalCode:
          type: string
          description: Postal or ZIP code.
        dmaCode:
          type: string
          description: US designated market area code.
        geonameId:
          type: string
          description: GeoNames identifier for the place.
        accuracyRadiusKm:
          type: number
          description: Radius in km the geolocation estimate is confident within.
        geoUpdatedAt:
          type: string
          description: ISO date the geo allocation last changed.
          format: date
    LiteLocation:
      type: object
      title: LiteLocation
      description: The four location fields the local dataset can answer.
      properties:
        country:
          type: string
          description: Country name.
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2 country code.
        continent:
          type: string
          description: Continent name.
        continentCode:
          type: string
          description: Two-letter continent code.
    Network:
      type: object
      title: Network
      properties:
        asn:
          type: string
          description: Autonomous system number, prefixed with AS.
          examples:
          - AS15169
        organization:
          type: string
          description: Registered organisation name for the network.
        domain:
          type: string
          description: Domain of the registered organisation.
        type:
          type: string
          description: Network category, for example business, isp, hosting, education, government.
        asnUpdatedAt:
          type: string
          description: ISO date the ASN allocation last changed.
          format: date
    LiteNetwork:
      type: object
      title: LiteNetwork
      description: The three network fields the local dataset can answer.
      properties:
        asn:
          type: string
          description: Autonomous system number, prefixed with AS.
          examples:
          - AS15169
        organization:
          type: string
          description: Registered organisation name for the network.
        domain:
          type: string
          description: Domain of the registered organisation.
    Mobile:
      type: object
      title: Mobile
      properties:
        carrier:
          type: string
          description: Mobile carrier name.
        mcc:
          type: string
          description: Mobile country code.
        mnc:
          type: string
          description: Mobile network code.
    Threats:
      type: object
      title: Threats
      description: Anonymiser signals. A missing boolean means we hold no data on it. It does NOT mean
        the answer is false — screen for anonymisers by treating an absent value as unknown, never as
        a negative.
      properties:
        service:
          type: string
          description: Named anonymiser detected on the address, when there is one.
        lastSeen:
          type: string
          description: ISO date the address was last seen anonymising.
          format: date
        recentActivityPct:
          type: number
          description: Share of recent days the address behaved like an anonymiser.
          minimum: 0
          maximum: 100
        isProxy:
          type: boolean
          description: The address is a known proxy.
        isRelay:
          type: boolean
          description: The address is a known private relay.
        isTor:
          type: boolean
          description: The address is a known Tor node.
        isVpn:
          type: boolean
          description: The address is a known VPN endpoint.
        isResidentialProxy:
          type: boolean
          description: The address is a known residential proxy.
    Flags:
      type: object
      title: Flags
      description: Cheap network booleans. A missing boolean means we hold no data on it. It does NOT
        mean the answer is false — screen for anonymisers by treating an absent value as unknown, never
        as a negative.
      properties:
        isAnonymous:
          type: boolean
          description: Any anonymising signal is set. Deduced from the booleans upstream sent.
        isAnycast:
          type: boolean
          description: The address is anycast.
        isHosting:
          type: boolean
          description: The address belongs to a hosting or cloud network.
        isMobile:
          type: boolean
          description: The address belongs to a mobile network.
        isSatellite:
          type: boolean
          description: The address belongs to a satellite network.
        isResidentialProxy:
          type: boolean
          description: The address is a known residential proxy.
    IpRecord:
      type: object
      title: IpRecord
      description: A MAX record. Every field except `ip` is optional and may be absent when there is no
        signal; treat missing and null identically. Branch on `bogon === true` before reading `location`
        or `network`.
      properties:
        ip:
          type: string
          description: The address this record describes.
        hostname:
          type: string
          description: Reverse DNS name, when one resolves.
        bogon:
          type: boolean
          description: The address is reserved or non-routable. No other field populates.
        location:
          $ref: '#/components/schemas/Location'
        network:
          $ref: '#/components/schemas/Network'
        mobile:
          $ref: '#/components/schemas/Mobile'
        threats:
          $ref: '#/components/schemas/Threats'
        flags:
          $ref: '#/components/schemas/Flags'
        lastUpdated:
          type: string
          description: ISO-8601 time this record was last refreshed.
          format: date-time
        derivedFields:
          type: array
          items:
            type: string
          description: Dotted paths of fields we worked out ourselves rather than received. A field that
            is present and NOT listed here came from upstream. Absent on most responses.
          examples:
          - - threats.isVpn
      required:
      - ip
    LiteRecord:
      type: object
      title: LiteRecord
      description: 'A LITE record. Narrower than a MAX record by design: the local dataset answers country
        and continent, not city, and carries no threat signals.'
      properties:
        ip:
          type: string
          description: The address this record describes.
        bogon:
          type: boolean
          description: The address is reserved or non-routable. No other field populates.
        location:
          $ref: '#/components/schemas/LiteLocation'
        network:
          $ref: '#/components/schemas/LiteNetwork'
        lastUpdated:
          type: string
          description: ISO-8601 time this record was last refreshed.
          format: date-time
        datasetUpdatedAt:
          type: string
          format: date-time
          description: Build time of the local dataset behind this answer, as an ISO-8601 timestamp. The
            only field that tells you the data has gone stale.
      required:
      - ip
    LookupContext:
      type: object
      title: LookupContext
      description: Optional metadata attached to the lookup in your own dashboard usage log. Never forwarded
        to any third party. Oversized or wrongly-typed values are rejected with invalid_request.
      properties:
        userAgent:
          type: string
          maxLength: 2000
          description: Originating user-agent string of the end user.
        email:
          type: string
          maxLength: 320
          description: End-user email, for correlating the lookup in your dashboard logs.
        username:
          type: string
          maxLength: 120
          description: Your internal username or handle for the end user.
        firstName:
          type: string
          maxLength: 120
          description: End-user first name.
        lastName:
          type: string
          maxLength: 120
          description: End-user last name.
        phone:
          type: string
          maxLength: 40
          description: End-user phone number, E.164 recommended.
        address:
          type: string
          maxLength: 500
          description: Claimed street address, for checking against the IP geolocation.
        city:
          type: string
          maxLength: 120
          description: Claimed city.
        region:
          type: string
          maxLength: 120
          description: Claimed region or state.
        country:
          type: string
          maxLength: 2
          description: Claimed country, ISO 3166-1 alpha-2.
        postal:
          type: string
          maxLength: 20
          description: Claimed postal code.
        note:
          type: string
          maxLength: 2000
          description: Free-form label such as an order id or ticket number.
        tags:
          type: array
          items:
            type: string
            maxLength: 40
          maxItems: 20
          description: Labels for filtering the usage log in your dashboard.
        extra:
          type: object
          propertyNames:
            maxLength: 64
          additionalProperties:
            oneOf:
            - type: string
              maxLength: 2000
            - type: number
            - type: boolean
            - type: 'null'
          description: Any other scalar metadata to attach to the log entry.
      additionalProperties: false
    LookupRequest:
      type: object
      title: LookupRequest
      properties:
        ip:
          type: string
          maxLength: 45
          description: IPv4 or IPv6 address to look up.
        context:
          $ref: '#/components/schemas/LookupContext'
      required:
      - ip
    BatchRequest:
      type: object
      title: BatchRequest
      properties:
        ips:
          type: array
          description: Addresses to look up. Duplicates collapse — the response is keyed by address —
            and are charged once.
          items:
            type: string
          minItems: 1
          maxItems: 100
      required:
      - ips
    BatchEntryError:
      type: object
      title: BatchEntryError
      description: 'A per-address failure inside a batch response. Note the flat shape: `error` is a code
        string here, not the `{ code, message }` object a whole-call error uses.'
      properties:
        error:
          $ref: '#/components/schemas/ErrorCode'
      required:
      - error
    BatchLiteResponse:
      type: object
      title: BatchLiteResponse
      description: Keyed by the address as it was sent.
      additionalProperties:
        oneOf:
        - $ref: '#/components/schemas/LiteRecord'
        - $ref: '#/components/schemas/BatchEntryError'
    BatchMaxResponse:
      type: object
      title: BatchMaxResponse
      description: Keyed by the address as it was sent.
      additionalProperties:
        oneOf:
        - $ref: '#/components/schemas/IpRecord'
        - $ref: '#/components/schemas/BatchEntryError'
    OpenApiDocument:
      type: object
      title: OpenApiDocument
      description: This document. The example beside it is the first few fields only; the served body
        also carries the full `paths` and `components` objects.
      properties:
        openapi:
          type: string
          description: Version of the OpenAPI specification this document is written to.
          pattern: ^3\.1\.\d+$
        info:
          type: object
          description: Identity, version and contact details for the API.
          properties:
            title:
              type: string
              description: Human name of the API.
            version:
              type: string
              description: Version of the API this document describes.
            summary:
              type: string
              description: One-line description. An OpenAPI 3.1 field; absent in 3.0.
            description:
              type: string
              description: Long-form description, in Markdown.
            termsOfService:
              type: string
              description: Terms of service.
              format: uri
            contact:
              type: object
              description: Who to contact about the API.
              properties:
                name:
                  type: string
                  description: Contact name.
                url:
                  type: string
                  description: Contact URL.
                  format: uri
                email:
                  type: string
                  description: Contact email address.
          required:
          - title
          - version
        externalDocs:
          type: object
          description: The human documentation this API is described by.
          properties:
            description:
              type: string
              description: Link text.
            url:
              type: string
              description: Absolute URL.
              format: uri
          required:
          - url
        servers:
          type: array
          description: Base URLs the operations below are relative to.
          items:
            type: object
            properties:
              url:
                type: string
                description: Absolute base URL.
                format: uri
              description:
                type: string
                description: What this server is.
            required:
            - url
        security:
          type: array
          description: The security requirement applied to every operation that does not override it.
          items:
            type: object
            description: Scheme name to required scopes.
        tags:
          type: array
          description: Operation groupings, in the order a renderer should show them.
          items:
            type: object
            properties:
              name:
                type: string
                description: Tag name.
              description:
                type: string
                description: What the group is.
            required:
            - name
        paths:
          type: object
          description: Every operation, keyed by path template.
          propertyNames:
            type: string
            pattern: ^/
        components:
          type: object
          description: The reusable schemas and security schemes the operations `$ref`.
          properties:
            schemas:
              type: object
              description: Every schema a response or body `$ref`s.
            securitySchemes:
              type: object
              description: How to authenticate.
      required:
      - openapi
      - info
    AsnRecord:
      type: object
      title: AsnRecord
      properties:
        asn:
          type: string
          description: AS number with the AS prefix.
          examples:
          - AS15169
        number:
          type: integer
          description: AS number.
        name:
          type: string
          description: Registered organisation name.
        domain:
          type: string
          description: Organisation domain.
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code of the registration.
        prefixCount:
          type: integer
          description: 'IPv4 /24 blocks attributed to this AS by a sampled sweep of routable IPv4 space:
            one address per /24 is probed, and the blocks that answer are counted. It is a size proxy
            — sampled and lossy — and it is not a count of announced BGP prefixes. On large networks the
            two differ by an order of magnitude, so do not read it as a route count.'
        datasetVersion:
          type: string
          description: ISO-8601 build time of the ASN dataset.
          format: date-time
      required:
      - asn
      - number
    AsnSearchResult:
      type: object
      title: AsnSearchResult
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AsnRecord'
      required:
      - items
    Health:
      type: object
      title: Health
      properties:
        ok:
          type: boolean
          description: Liveness only. Always true on a response at all, and deliberately independent of
            `lite` — a process with no dataset is still alive and still serves every other endpoint.
        ts:
          type: integer
          description: Server time in milliseconds since the epoch.
        lite:
          $ref: '#/components/schemas/LiteReaderHealth'
      required:
      - ok
      - ts
      - lite
    LiteReaderHealth:
      type: object
      title: LiteReaderHealth
      description: 'Whether the process answering this request holds the Lite dataset in memory. The file
        existing on disk is a different fact: a failed load leaves a current snapshot unread while every
        LITE lookup answers 503.'
      properties:
        loaded:
          type: boolean
          description: False means every LITE lookup on this process is answering 503.
        datasetUpdatedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When the dataset THIS process loaded was last written. Null while nothing is loaded.
            Older than the file on disk means the process never picked up a refresh.
      required:
      - loaded
      - datasetUpdatedAt
    ServiceIndex:
      type: object
      title: ServiceIndex
      properties:
        service:
          type: string
        version:
          type: string
        docs:
          type: string
          format: uri
          description: Absolute URL of the human documentation. Absolute because it is on the website,
            not on this host.
        openapi:
          type: string
          description: Path to this document.
        endpoints:
          type: array
          items:
            type: string
      required:
      - service
      - version
      - endpoints
