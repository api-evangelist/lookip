  /v1/batch/lite:
    post:
      tags:
      - Batch
      operationId: batchLite
      summary: LITE Batch
      description: Up to 100 addresses. Debited up front for the distinct resolvable addresses only —
        malformed entries and bogons are classified out before the wallet is touched, and a repeated address
        is charged once. If the balance cannot cover the batch the whole call is rejected with 402 and
        nothing is served.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
            example:
              ips:
              - 8.8.8.8
              - 1.1.1.1
              - 2606:4700:4700::1111
      responses:
        '200':
          description: An object keyed by address. Per-address failures are reported inside the object
            and do not fail the call.
          headers:
            X-Lookup-Kind:
              description: Which kind was billed.
              schema:
                type: string
                enum:
                - LITE
                - MAX
            X-Credit-Debit-MicroUsd:
              description: µUSD this call cost, as a decimal string. Net of any reversal.
              schema:
                type: string
                pattern: ^[0-9]+$
            X-Credit-Balance-MicroUsd:
              description: µUSD remaining after the debit, as a decimal string.
              schema:
                type: string
                pattern: ^[0-9]+$
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchLiteResponse'
              examples:
                mixed:
                  summary: One resolved address, one bogon, and one per-address failure — the three entry
                    shapes a caller has to handle.
                  value:
                    8.8.8.8:
                      ip: 8.8.8.8
                      location:
                        country: United States
                        countryCode: US
                        continent: North America
                        continentCode: NA
                      network:
                        asn: AS15169
                        organization: Google LLC
                        domain: google.com
                      lastUpdated: '2026-08-14T09:45:16.269Z'
                      datasetUpdatedAt: '2026-08-13T13:37:50.000Z'
                    10.0.0.1:
                      ip: 10.0.0.1
                      bogon: true
                    not-an-ip:
                      error: invalid_ip
        '400':
          description: '`invalid_request` — Malformed body, invalid context, bad batch array, or an unparseable
            ASN.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  summary: Malformed body, invalid context, bad batch array, or an unparseable ASN.
                  value:
                    error:
                      code: invalid_request
                      message: Malformed body, invalid context, bad batch array, or an unparseable ASN.
        '401':
          description: '`unauthorized` — Missing, invalid, or revoked API key.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unauthorized:
                  summary: Missing, invalid, or revoked API key.
                  value:
                    error:
                      code: unauthorized
                      message: Missing, invalid, or revoked API key.
        '402':
          description: '`insufficient_credit` — Balance too low to serve the call. Nothing was debited
            and nothing was served.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientCreditError'
              examples:
                insufficient_credit:
                  summary: Balance too low to serve the call. Nothing was debited and nothing was served.
                  value:
                    error:
                      code: insufficient_credit
                      message: Balance too low to serve the call. Nothing was debited and nothing was
                        served.
                    credit:
                      balanceMicroUsd: '420'
                      needMicroUsd: '1300'
                      balanceCents: 0
                      needCents: 0
                      kind: MAX
        '429':
          description: '`rate_limited` — Per-key cap of 50 requests/second exceeded, or the upstream provider
            rate-limited a MAX lookup. No credit spent.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
